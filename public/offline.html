<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>VisitFlow hors ligne</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      img {
        width: 80px;
        height: 80px;
      }

      h1 {
        margin: 24px 0 10px;
        font-size: 1.5rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #475569;
        line-height: 1.6;
      }

      button {
        margin-top: 24px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        padding: 12px 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Connexion indisponible</h1>
      <p>VisitFlow est installe, mais cette page a besoin du reseau pour recuperer les donnees recentes.</p>
      <button type="button" onclick="window.location.reload()">Reessayer</button>
    </main>
  </body>
</html>
